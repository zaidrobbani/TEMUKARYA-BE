# Compose produksi (server temukarya.bccdev.id). Panduan: docs/deploy.md
# Bedanya dengan docker-compose.yml (dev): kode tidak di-mount, tanpa --reload,
# MySQL & API hanya bisa diakses dari localhost server, trafik publik lewat nginx.
name: temukarya-prod

services:
  db:
    # CPU VM tanpa x86-64-v2 tidak bisa menjalankan mysql:8.4 (Oracle Linux 9): pakai mysql:8.0-debian.
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
    image: temukarya-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      PORTFOLIO_STORAGE_ROOT: /app/storage/portfolios
      PROJECT_ATTACHMENT_STORAGE_ROOT: /app/storage/projects
      SUBMISSION_STORAGE_ROOT: /app/storage/submissions
      AVATAR_STORAGE_ROOT: /app/storage/avatars
      CHAT_STORAGE_ROOT: /app/storage/chat
    # Wajib 1 worker: hub WebSocket chat & dispatcher push masih in-memory per proses.
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/storage
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  # Cadangan kalau SMTP asli belum ada: email ditangkap Mailpit, buka lewat SSH tunnel.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    profiles: ["mailpit"]
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  mysql_data:
  uploads:
