# CI: build image + test di dalamnya terhadap MySQL 8.0 (sama dengan server produksi).
# CD: push ke main → SSH ke server → docker/deploy.sh. Setup secret: docs/deploy.md bagian "CI/CD".
name: CI/CD

on:
  push:
    branches: main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.mysql }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mysql: ["mysql:8.0-debian"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Image yang sama dengan produksi; test dijalankan di dalamnya karena sebagian test integrasi mewajibkan container.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: temukarya-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Jalankan MySQL
        run: |
          docker network create ci
          docker run -d --name db --network ci \
            -e MYSQL_ROOT_PASSWORD=root-ci -e MYSQL_DATABASE=temukarya \
            -e MYSQL_USER=temukarya -e MYSQL_PASSWORD=ci-password \
            ${{ matrix.mysql }} \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+00:00
          for i in $(seq 1 60); do
            docker exec db mysql -utemukarya -pci-password -e "select 1" temukarya >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs db; exit 1

      - name: Siapkan env test
        run: |
          cat > ci.env <<'ENV'
          DB_HOST=db
          DB_PORT=3306
          DB_NAME=temukarya
          DB_USER=temukarya
          DB_PASSWORD=ci-password
          APP_ENV=test
          JWT_SECRET_KEY=ci-secret-key-yang-panjangnya-minimal-32-karakter
          TEMUKARYA_RUN_MYSQL_TESTS=1
          TEMUKARYA_MYSQL_INTEGRATION=1
          ENV

      - name: Migrasi
        run: docker run --rm --network ci --env-file ci.env --entrypoint alembic temukarya-api:ci upgrade head

      - name: Test (host db)
        run: >
          docker run --rm --network ci --env-file ci.env --entrypoint python temukarya-api:ci
          -m pytest -q -p no:cacheprovider
          --ignore=tests/modules/admin_statistics/test_admin_mysql.py
          --ignore=tests/modules/chat/test_chat_mysql.py
          --ignore=tests/modules/milestones/test_milestones_mysql.py
          --ignore=tests/modules/matching/test_matching_mysql.py

      # Empat file ini hanya mengizinkan host localhost/127.0.0.1: pinjam network namespace container MySQL.
      - name: Test (host 127.0.0.1)
        run: >
          docker run --rm --network container:db --env-file ci.env -e DB_HOST=127.0.0.1
          --entrypoint python temukarya-api:ci
          -m pytest -q -p no:cacheprovider
          tests/modules/admin_statistics/test_admin_mysql.py
          tests/modules/chat/test_chat_mysql.py
          tests/modules/milestones/test_milestones_mysql.py
          tests/modules/matching/test_matching_mysql.py

  deploy:
    name: Deploy ke server
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://temukarya.bccdev.id/docs
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Siapkan SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Secret DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS belum diisi (lihat docs/deploy.md bagian CI/CD)"
            exit 1
          fi
          if [ -z "${{ vars.DEPLOY_HOST }}" ] || [ -z "${{ vars.DEPLOY_PORT }}" ] || [ -z "${{ vars.DEPLOY_USER }}" ] || [ -z "${{ vars.DEPLOY_PATH }}" ]; then
            echo "::error::Variable DEPLOY_HOST / DEPLOY_PORT / DEPLOY_USER / DEPLOY_PATH belum diisi (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST  }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT  }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER  }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        # Kalau key di server dikunci dengan command= (disarankan), perintah di bawah diabaikan dan deploy.sh tetap yang jalan.
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash $DEPLOY_PATH/docker/deploy.sh"

      - name: Cek dari internet
        run: |
          for i in $(seq 1 12); do
            curl -fsS --max-time 10 https://temukarya.bccdev.id/api/v1/health && exit 0
            sleep 5
          done
          exit 1
