# Reverse proxy di depan API (dipakai docker-compose.prod.yml).
# Alur: client → proxy BCC (temukarya.bccdev.id) → nginx :80 di VM → api:8000.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Proxy BCC biasanya sudah mengirim X-Forwarded-Proto; kalau kosong pakai skema nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream temukarya_api {
    server api:8000;
}

server {
    listen 80 default_server;
    server_name temukarya.bccdev.id _;

    # Upload terbesar: hasil kerja 50 MB.
    client_max_body_size 60m;

    location / {
        proxy_pass http://temukarya_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # WebSocket chat: WS /api/v1/conversations/{id}/ws
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
